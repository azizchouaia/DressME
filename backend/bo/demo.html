<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DressMe Agents</title>
<style>
  :root { --bg:#f6f3ee; --panel:#fffdf9; --ink:#1f1d1a; --muted:#6f6a62; --line:#e6dfd4; --accent:#8a5a2b; --accent-ink:#fff;
          --soft:#f1e4d4; --chip:#efe9df; --good:#3f7d4e; --warn:#b5532f; --llm:#6b4fa0; --llmsoft:#ece6f6; --tool:#2f6d8a; --toolsoft:#e2eff5; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#151412; --panel:#1f1d1a; --ink:#f0ebe3; --muted:#a39d93; --line:#34302a;
          --accent:#d9a46a; --accent-ink:#1b1209; --soft:#3a2d20; --chip:#2a2723; --good:#7cc08b; --warn:#e48a66; --llm:#b9a2e6; --llmsoft:#2e2740; --tool:#8cc6de; --toolsoft:#1e2f36; } }
  * { box-sizing: border-box; } html, body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; overflow-x:hidden; }
  button, input, select { font: inherit; color: inherit; }
  .app { max-width: 1260px; margin: 0 auto; padding: 12px 16px 40px; }
  header { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:10px; } header h1 { margin:0; font-size:20px; }
  .muted { color: var(--muted); } .small { font-size: 12px; }
  .grid { display:grid; grid-template-columns:minmax(0,1fr); gap:14px; } @media (min-width:980px){ .grid { grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); align-items:start; } }
  .grid > * { min-width: 0; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; min-width:0; }
  .card h2 { margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); display:flex; justify-content:space-between; gap:8px; align-items:center; flex-wrap:wrap; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  select, input[type=text] { padding:9px 10px; border:1px solid var(--line); border-radius:10px; background:var(--bg); min-width:0; }
  .btn { border:0; background:var(--accent); color:var(--accent-ink); padding:10px 16px; border-radius:12px; font-weight:700; cursor:pointer; }
  .btn:disabled { opacity:.5; cursor:default; } .ghost { border:1px solid var(--line); background:transparent; padding:7px 12px; border-radius:10px; cursor:pointer; font-size:13px; }
  .chip { border:1px solid var(--line); background:var(--chip); padding:6px 11px; border-radius:999px; cursor:pointer; font-size:13px; }
  .chat { display:flex; flex-direction:column; gap:8px; height:52vh; min-height:320px; overflow-y:auto; padding:4px; }
  .bub { max-width:90%; padding:9px 12px; border-radius:14px; white-space:pre-wrap; word-break:break-word; }
  .me { align-self:flex-end; background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:var(--chip); border-bottom-left-radius:4px; }
  .meta { display:block; font-size:11px; opacity:.75; margin-top:5px; }
  .outfits { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .of { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:6px; display:flex; gap:4px; align-items:center; }
  .of img, .of .sw { width:46px; height:46px; object-fit:contain; border-radius:8px; background:var(--chip); }
  .of .sc { font-size:11px; color:var(--muted); padding:0 4px; }
  .sugg { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .chatin { display:flex; gap:8px; margin-top:10px; } .chatin input { flex:1; }
  .pipe .st { display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line); align-items:start; }
  .pipe .ic { width:22px; height:22px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; background:var(--chip); }
  .st.llm .ic { background:var(--llmsoft); color:var(--llm); } .st.tool .ic { background:var(--toolsoft); color:var(--tool); }
  .st.agent .ic { background:var(--soft); color:var(--accent); }
  .pipe b { font-size:13px; } .pipe .det { font-size:12px; color:var(--muted); word-break:break-word; } .pipe .ms { font-size:11px; color:var(--muted); white-space:nowrap; }
  .pipe .sub { margin-left:18px; border-left:2px solid var(--line); padding-left:8px; }
  .agents { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px; }
  .ag { border:1px solid var(--line); border-radius:12px; padding:10px; background:var(--bg); font-size:13px; }
  .ag h3 { margin:0 0 4px; font-size:14px; display:flex; justify-content:space-between; gap:6px; } .ag .tag { font-size:11px; color:var(--accent); font-weight:700; }
  .ag .acts { margin-top:6px; display:flex; flex-wrap:wrap; gap:4px; } .ag .acts span { background:var(--chip); border-radius:6px; padding:1px 6px; font-size:11px; }
  .ag.orch { border-color: var(--accent); }
  details summary { cursor:pointer; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<div class="app">
  <header><h1>DressMe · BO1 & BO2 agents</h1><span class="small muted" id="llm">local LLM</span></header>
  <div class="grid">
    <div>
      <div class="card">
        <h2>Chat <span class="row">
          <select id="agent" title="who you talk to"></select>
          <select id="user"><option value="demo_f">demo wardrobe (demo_f)</option><option value="demo_m">demo wardrobe (demo_m)</option><option value="me">my 3D wardrobe (me)</option></select>
        </span></h2>
        <div class="chat" id="chat"></div>
        <div class="sugg" id="sugg"></div>
        <div class="chatin"><input type="text" id="q" placeholder="Ask… (English, français)" autocomplete="off"><button class="btn" id="go">Send</button></div>
        <div class="row" style="margin-top:8px">
          <label class="ghost">📷 photo of a piece <input type="file" id="photo" accept="image/*" style="display:none"></label>
          <span class="small muted" id="photoinfo"></span>
          <button class="ghost" id="reset" style="margin-left:auto">New conversation</button>
        </div>
      </div>
    </div>
    <div>
      <div class="card">
        <h2>Agent pipeline <span class="small" id="total"></span></h2>
        <div class="pipe" id="pipe"><p class="small muted" style="margin:0">Each answer shows its steps here: memory → routing LLM (orchestrator) → idea agent (its LLM picks the action) → tools (module agents) → answer LLM.</p></div>
      </div>
    </div>
  </div>
  <div class="card" style="margin-top:14px">
    <h2>All agents <span class="small" id="agcount"></span></h2>
    <div class="agents" id="agents"></div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let CATALOG = {}, PHOTO = null, SESSION = 'web-' + Math.random().toString(36).slice(2, 8);
const SUGG = {
  personalised_recommendations: ["What should I wear tomorrow for work?", "Why this outfit?", "Give me another one", "Build an outfit with my black t-shirt", "Show me pieces I haven't worn in a long time", "Make me a capsule of 8 pieces", "Je pars à Paris 3 jours, qu'est-ce que je prends ?", "What are my colours?", "Is my style changing?", "What am I missing in my wardrobe?", "Show it on my avatar"],
  time_optimisation: ["What's my outfit for today?", "Tomorrow's outfit", "Change the shoes", "My black t-shirt is dirty", "What's in the laundry?", "Laundry is done", "I have a wedding on 2026-11-07", "Where can I buy white sneakers in Tunis under 150 TND?", "What can I get rid of?", "Should I buy this? (send a photo)", "My notifications"],
};
async function j(url, opts) { const r = await fetch(url, opts); const t = await r.text(); try { return JSON.parse(t); } catch (e) { throw new Error(r.status + ' ' + t.slice(0, 150)); } }
function bubble(text, who, meta) { const d = document.createElement('div'); d.className = 'bub ' + who; d.textContent = text; if (meta) { const m = document.createElement('span'); m.className = 'meta'; m.textContent = meta; d.appendChild(m); } $('#chat').appendChild(d); $('#chat').scrollTop = 1e9; return d; }
function pieceHtml(id, name) { const p = CATALOG[id] || {}; const n = name || p.name || id; return p.image ? `<img src="${esc(p.image)}" title="${esc(n)}" alt="${esc(n)}">` : `<span class="sw" title="${esc(n)}"></span>`; }
function outfitsOf(data) {
  const lists = [];
  for (const k of ['outfits', 'looks']) if (Array.isArray(data[k])) data[k].forEach(o => o.item_ids && lists.push({ ids: o.item_ids, pieces: o.pieces, score: o.score }));
  if (data.item_ids && data.item_ids.length) lists.push({ ids: data.item_ids, pieces: data.pieces });
  return lists.slice(0, 3);
}
const ICON = { memory: 'M', llm_route: 'L', rule_route: 'R', llm_answer: 'L', tool: 'T', agent: 'A', wardrobe: 'W', workflow: '⚙' };
const KIND = { llm_route: 'llm', llm_answer: 'llm', tool: 'tool', agent: 'agent' };
function stepLine(s) {
  let title = s.step, det = '';
  if (s.step === 'memory') { title = `${s.agent} · memory`; det = `${s.turns} past messages · likes ${JSON.stringify(s.profile.likes)} · dislikes ${JSON.stringify(s.profile.dislikes)}`; }
  else if (s.step === 'llm_route') { title = `${s.agent} · LLM routing`; det = `→ ${s.decision}` + (s.how ? ` (${s.how})` : '') + (s.args && Object.keys(s.args).length ? ` args ${JSON.stringify(s.args)}` : ''); }
  else if (s.step === 'rule_route') { title = `${s.agent} · guardrail`; det = `→ ${s.decision}`; }
  else if (s.step === 'llm_answer') { title = `${s.agent} · LLM answer`; det = 'reply written from the facts'; }
  else if (s.step === 'tool') { title = `${s.agent} → tool ${s.to}.${s.action}`; det = s.ok === false ? 'error ' + (s.error || '') : 'ok'; }
  else if (s.step === 'agent') { title = `${s.agent} → agent ${s.to}` + (s.action ? `.${s.action}` : ''); det = s.ok ? 'ok' : 'error'; }
  else if (s.step === 'wardrobe') { title = `${s.agent} · wardrobe`; det = `${s.pieces} pieces · ${s.source}`; }
  else if (s.step === 'workflow') { title = `${s.agent} · workflow ${s.action}`; det = 'done'; }
  let html = `<div class="st ${KIND[s.step] || ''}"><span class="ic">${ICON[s.step] || '·'}</span><div><b>${esc(title)}</b><div class="det">${esc(det)}</div></div><span class="ms">${s.ms ? (s.ms / 1000).toFixed(1) + ' s' : ''}</span></div>`;
  if (s.sub_steps && s.sub_steps.length) html += `<div class="sub">${s.sub_steps.map(stepLine).join('')}</div>`;
  return html;
}
async function send(text) {
  text = (text ?? $('#q').value).trim(); if (!text) return;
  $('#q').value = ''; bubble(text, 'me');
  const wait = bubble('… thinking (local LLM)', 'bot'); $('#go').disabled = true; const t0 = performance.now();
  try {
    const payload = {}; if (PHOTO && /photo|buy|acheter|goes with|this\?/i.test(text)) payload.args = { photo: PHOTO };
    const body = { agent: $('#agent').value, user_id: $('#user').value, session_id: SESSION, message: text, payload };
    if (payload.args) { body.payload = { action: /buy|acheter/i.test(text) ? 'should_buy' : 'complete_look', args: payload.args }; if ($('#agent').value !== 'photo_piece') body.agent = 'photo_piece'; body.payload.reply = true; }
    const r = await j('/bo/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const res = r.result || {}; const data = res.data || {}; wait.remove();
    const text2 = res.reply || r.question || res.error || '(no answer)';
    const b = bubble(text2, 'bot', `${r.agent}${data.handled_by ? ' → ' + data.handled_by : ''} · ${res.model || ''} · ${((performance.now() - t0) / 1000).toFixed(1)} s`);
    const outs = outfitsOf(data);
    if (outs.length) { const box = document.createElement('div'); box.className = 'outfits';
      box.innerHTML = outs.map((o, k) => `<div class="of">${o.ids.map((id, i) => pieceHtml(id, (o.pieces || [])[i])).join('')}<span class="sc">${o.score ? Math.round(o.score * 100) + '%' : ''}</span>${$('#user').value === 'me' ? `<a class="ghost" href="/beta1/demo?wear=${o.ids.join(',')}" target="_blank">3D</a>` : ''}</div>`).join('');
      b.appendChild(box); }
    if (data.viewer) { const a = document.createElement('a'); a.href = data.viewer; a.target = '_blank'; a.className = 'ghost'; a.textContent = 'Open on my 3D avatar'; b.appendChild(a); }
    $('#pipe').innerHTML = (res.steps || []).map(stepLine).join('') || '<p class="small muted">no steps</p>';
    $('#total').textContent = `${(res.steps || []).length} steps · ${((performance.now() - t0) / 1000).toFixed(1)} s`;
  } catch (e) { wait.textContent = 'Error: ' + e.message; }
  $('#go').disabled = false;
}
function renderSugg() { const a = $('#agent').value; const list = SUGG[a] || (window.AGENTS.find(x => x.name === a) || {}).examples || [];
  $('#sugg').innerHTML = list.map(s => `<button class="chip">${esc(s)}</button>`).join(''); }
async function loadCatalog() { try { CATALOG = (await j('/bo/catalog?user_id=' + encodeURIComponent($('#user').value))).pieces; } catch (e) { CATALOG = {}; } }
async function init() {
  const ags = (await j('/bo/agents')).agents; window.AGENTS = ags;
  ags.sort((a, b) => (b.orchestrator - a.orchestrator) || a.owner.localeCompare(b.owner) || a.name.localeCompare(b.name));
  $('#agent').innerHTML = ags.map(a => `<option value="${a.name}">${a.orchestrator ? '★ ' : '  '}${a.name} (${a.owner})</option>`).join('');
  $('#agcount').textContent = `${ags.length} agents (${ags.filter(a => a.orchestrator).length} orchestrators)`;
  $('#agents').innerHTML = ags.map(a => `<div class="ag ${a.orchestrator ? 'orch' : ''}"><h3>${esc(a.name)} <span class="tag">${a.orchestrator ? 'ORCHESTRATOR · ' : ''}${esc(a.owner)}</span></h3>
    <div class="muted">${esc(a.role)}</div>${Array.isArray(a.ideas) ? `<div class="small" style="margin-top:4px"><b>Ideas:</b> ${esc(a.ideas.join(' · '))}</div>` : ''}
    <div class="small"><b>Tools:</b> ${esc(Object.entries(a.skills || {}).map(([k, v]) => `${k} (${v})`).join(', ') || 'the idea agents')}</div>
    <div class="acts">${Object.keys(a.actions).slice(0, 18).map(k => `<span>${esc(k)}</span>`).join('')}</div></div>`).join('');
  renderSugg(); await loadCatalog();
  bubble('Hi! Talk to the BO1 agent (personalised recommendations) or the BO2 agent (time optimisation), or pick any idea agent above. Every answer shows its pipeline on the right.', 'bot');
  fetch('/stylist/status').then(r => r.json()).then(r => { const s = r.result; $('#llm').textContent = s.ollama ? `${s.model} via Ollama ✓` : 'Ollama not running'; }).catch(() => {});
}
$('#go').onclick = () => send(); $('#q').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
$('#sugg').onclick = e => { const b = e.target.closest('.chip'); if (b) send(b.textContent.replace(' (send a photo)', '')); };
$('#agent').onchange = renderSugg; $('#user').onchange = loadCatalog;
$('#reset').onclick = async () => { await fetch(`/bo/memory?user_id=${encodeURIComponent($('#user').value)}&session_id=${SESSION}`, { method: 'DELETE' }); SESSION = 'web-' + Math.random().toString(36).slice(2, 8); $('#chat').innerHTML = ''; bubble('New conversation (taste profile kept).', 'bot'); };
$('#photo').onchange = async e => { const f = e.target.files[0]; if (!f) return; const fd = new FormData(); fd.append('photo', f);
  try { PHOTO = (await j('/bo/upload', { method: 'POST', body: fd })).path; $('#photoinfo').textContent = '✓ photo ready: ask "Should I buy this?" or "What goes with this?"'; } catch (err) { $('#photoinfo').textContent = err.message; } };
init().catch(e => bubble('Error: ' + e.message, 'bot'));
</script>
</body>
</html>
