# M7 test set: shopping requests as users write them, with what they mean (written by hand).
#
# lang: fr | en | darija (Latin letters, digits for Arabic sounds) | arabic (Arabic script)
# expect: the intent of the request. Used twice by run.py:
#   - parse accuracy: type (subcategory, or category for a generic word), color, gender, max_price,
#     min_price, city are compared with what parse.py understood (absent field = nothing asked);
#   - relevance of each product (0 / 1 / 2), from the catalogue attributes; name_any (optional) = words
#     of which one must be in the product name for a perfect match (material, occasion).
# Colour codes and types: taxonomy.py. Do not tune the expectations to the parser's answers.

