services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file: .env
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  api:
    build: ../backend
    env_file: .env
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on: [postgres, redis, minio]
    profiles: ["full"]

  worker:
    build: ../backend
    env_file: .env
    command: celery -A shared.queue.celery_app worker -l info
    depends_on: [redis]
    profiles: ["full"]

volumes:
  pgdata:
  miniodata:
