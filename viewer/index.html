<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Avatar</title>
    <style>
      html,
      body,
      canvas {
        margin: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: transparent;
      }
      body {
        overflow: hidden;
        background: linear-gradient(#f7f4ef, #e6e0d6);
      }
      #reset,
      #error {
        position: absolute;
        z-index: 2;
        font: 14px/1.2 system-ui, sans-serif;
      }
      #reset {
        right: 12px;
        bottom: 12px;
        border: 0;
        border-radius: 999px;
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.92);
        color: #141414;
      }
      #error {
        left: 12px;
        right: 12px;
        top: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        background: #fff;
        color: #b3261e;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <button id="reset" type="button" hidden>Reset view</button>
    <p id="error" role="alert" hidden></p>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./src/scene.mjs"></script>
  </body>
</html>
